      - name: Validate schemas and positive examples
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import (
              Draft202012Validator,
              FormatChecker,
          )
          from referencing import Registry, Resource

          SCHEMA_DIR = Path("schemas").resolve()
          EXAMPLE_DIR = Path("examples").resolve()

          schema_files = sorted(
              SCHEMA_DIR.glob("*.schema.json")
          )

          if not schema_files:
              raise SystemExit("No schema files found")

          schemas = {}
          schema_uris = {}
          registry = Registry()

          #
          # Load all schemas first.
          #
          # A file:// $id is injected when the source schema
          # has no explicit $id.
          #
          # This gives relative refs such as:
          #
          #   ./common.schema.json#/$defs/evidence_scope
          #
          # a concrete base URI while remaining fully offline.
          #
          for path in schema_files:
              schema = json.loads(
                  path.read_text(encoding="utf-8")
              )

              uri = path.as_uri()

              if "$id" not in schema:
                  schema["$id"] = uri

              Draft202012Validator.check_schema(
                  schema
              )

              schemas[path.name] = schema
              schema_uris[path.name] = uri

              registry = registry.with_resource(
                  uri,
                  Resource.from_contents(schema),
              )

              print(f"Schema OK: {path.relative_to(Path.cwd())}")

          def load(name):
              if name not in schemas:
                  raise SystemExit(
                      f"Missing schema: {name}"
                  )

              return schemas[name]

          mappings = {
              "01-local-premature-rii-basis.json":
                  "rii-basis.schema.json",

              "02-local-premature-rii-assessment.json":
                  "rii-update-assessment.schema.json",

              "03-imported-success-input.json":
                  "cross-unit-evidence-input.schema.json",

              "04-cross-unit-evidence-normalized.json":
                  "cross-unit-evidence.schema.json",

              "05-imported-success-rii-basis.json":
                  "rii-basis.schema.json",

              "06-imported-success-rii-assessment.json":
                  "rii-update-assessment.schema.json",

              "07-imported-pilot-binding.json":
                  "imported-pilot-binding.schema.json",

              "08-local-outcome-after-imported-pilot.json":
                  "local-outcome-evidence.schema.json",

              "09-local-rii-basis-after-pilot.json":
                  "rii-basis.schema.json",

              "10-local-rii-assessment-after-pilot.json":
                  "rii-update-assessment.schema.json",

              "11-local-unknown-rii-basis.json":
                  "rii-basis.schema.json",

              "12-local-unknown-rii-assessment.json":
                  "rii-update-assessment.schema.json",

              "13-receipt-envelope-cross-unit.json":
                  "receipt-envelope.schema.json",
          }

          validated = 0

          for example_name, schema_name in mappings.items():
              example_path = (
                  EXAMPLE_DIR / example_name
              )

              if not example_path.exists():
                  raise SystemExit(
                      "Missing positive example: "
                      f"examples/{example_name}"
                  )

              instance = json.loads(
                  example_path.read_text(
                      encoding="utf-8"
                  )
              )

              schema = load(schema_name)

              validator = Draft202012Validator(
                  schema,
                  registry=registry,
                  format_checker=FormatChecker(),
              )

              errors = sorted(
                  validator.iter_errors(instance),
                  key=lambda error:
                      list(error.absolute_path),
              )

              if errors:
                  print(
                      "\nValidation failed: "
                      f"{example_name} -> "
                      f"{schema_name}"
                  )

                  for error in errors:
                      location = ".".join(
                          str(x)
                          for x
                          in error.absolute_path
                      )

                      print(
                          f"- {location or '<root>'}: "
                          f"{error.message}"
                      )

                  raise SystemExit(1)

              print(
                  "Example OK: "
                  f"{example_name} -> "
                  f"{schema_name}"
              )

              validated += 1

          print(
              "\nPositive contract validation "
              f"passed: {validated} examples"
          )
          PY
