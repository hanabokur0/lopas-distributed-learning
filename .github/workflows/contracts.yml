name: Contract CI

on:
  push:
    paths:
      - "schemas/**"
      - "examples/**"
      - "src/receipts/**"
      - "src/canonical.ts"
      - ".github/workflows/contracts.yml"

  pull_request:
    paths:
      - "schemas/**"
      - "examples/**"
      - "src/receipts/**"
      - "src/canonical.ts"
      - ".github/workflows/contracts.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Validate schemas and examples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator
        run: |
          python -m pip install --upgrade pip
          python -m pip install "jsonschema[format]>=4.23,<5"

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          roots = [
              Path("schemas"),
              Path("examples"),
          ]

          count = 0

          for root in roots:
              if not root.exists():
                  raise SystemExit(f"Missing directory: {root}")

              for path in root.rglob("*.json"):
                  with path.open("r", encoding="utf-8") as f:
                      json.load(f)

                  print(f"JSON OK: {path}")
                  count += 1

          if count == 0:
              raise SystemExit("No JSON files found")

          print(f"\nJSON syntax validation passed: {count} files")
          PY

      - name: Validate schemas and positive examples
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          from referencing import Registry, Resource

          SCHEMA_DIR = Path("schemas")
          EXAMPLE_DIR = Path("examples")

          schema_files = sorted(SCHEMA_DIR.glob("*.schema.json"))

          if not schema_files:
              raise SystemExit("No schema files found")

          schemas = {}

          registry = Registry()

          for path in schema_files:
              schema = json.loads(path.read_text(encoding="utf-8"))

              Draft202012Validator.check_schema(schema)

              uri = path.resolve().as_uri()
              resource = Resource.from_contents(schema)
              registry = registry.with_resource(uri, resource)

              schemas[path.name] = schema

              print(f"Schema OK: {path}")

          def load(name):
              path = SCHEMA_DIR / name
              if not path.exists():
                  raise SystemExit(f"Missing schema: {path}")
              return schemas[name]

          mappings = {
              "01-local-premature-rii-basis.json":
                  "rii-basis.schema.json",

              "02-local-premature-rii-assessment.json":
                  "rii-update-assessment.schema.json",

              "03-imported-success-input.json":
                  "cross-unit-evidence-input.schema.json",

              "04-cross-unit-evidence-normalized.json":
                  "cross-unit-evidence.schema.json",

              "05-imported-success-rii-basis.json":
                  "rii-basis.schema.json",

              "06-imported-success-rii-assessment.json":
                  "rii-update-assessment.schema.json",

              "07-imported-pilot-binding.json":
                  "imported-pilot-binding.schema.json",

              "08-local-outcome-after-imported-pilot.json":
                  "local-outcome-evidence.schema.json",

              "09-local-rii-basis-after-pilot.json":
                  "rii-basis.schema.json",

              "10-local-rii-assessment-after-pilot.json":
                  "rii-update-assessment.schema.json",

              "11-local-unknown-rii-basis.json":
                  "rii-basis.schema.json",

              "12-local-unknown-rii-assessment.json":
                  "rii-update-assessment.schema.json",

              "13-receipt-envelope-cross-unit.json":
                  "receipt-envelope.schema.json",
          }

          validated = 0

          for example_name, schema_name in mappings.items():
              example_path = EXAMPLE_DIR / example_name

              if not example_path.exists():
                  raise SystemExit(
                      f"Missing positive example: {example_path}"
                  )

              instance = json.loads(
                  example_path.read_text(encoding="utf-8")
              )

              schema_path = SCHEMA_DIR / schema_name
              schema = load(schema_name)

              validator = Draft202012Validator(
                  schema,
                  registry=registry,
                  format_checker=FormatChecker(),
              )

              errors = sorted(
                  validator.iter_errors(instance),
                  key=lambda e: list(e.absolute_path),
              )

              if errors:
                  print(
                      f"\nValidation failed: "
                      f"{example_name} -> {schema_name}"
                  )

                  for error in errors:
                      location = ".".join(
                          str(x) for x in error.absolute_path
                      )

                      print(
                          f"- {location or '<root>'}: "
                          f"{error.message}"
                      )

                  raise SystemExit(1)

              print(
                  f"Example OK: "
                  f"{example_name} -> {schema_name}"
              )

              validated += 1

          print(
              f"\nPositive contract validation passed: "
              f"{validated} examples"
          )
          PY

      - name: Verify intentional invalid example is rejected
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          from referencing import Registry, Resource

          schema_dir = Path("schemas")

          registry = Registry()

          schemas = {}

          for path in schema_dir.glob("*.schema.json"):
              schema = json.loads(
                  path.read_text(encoding="utf-8")
              )

              registry = registry.with_resource(
                  path.resolve().as_uri(),
                  Resource.from_contents(schema),
              )

              schemas[path.name] = schema

          invalid_path = Path(
              "examples/invalid/"
              "imported-direct-boundary-update.INVALID.json"
          )

          if not invalid_path.exists():
              raise SystemExit(
                  f"Missing invalid example: {invalid_path}"
              )

          instance = json.loads(
              invalid_path.read_text(encoding="utf-8")
          )

          schema = schemas[
              "rii-update-assessment.schema.json"
          ]

          validator = Draft202012Validator(
              schema,
              registry=registry,
          )

          errors = list(
              validator.iter_errors(instance)
          )

          if not errors:
              raise SystemExit(
                  "INVALID example unexpectedly passed schema validation"
              )

          print(
              "Intentional invalid example rejected as expected"
          )

          for error in errors:
              location = ".".join(
                  str(x) for x in error.absolute_path
              )

              print(
                  f"- {location or '<root>'}: "
                  f"{error.message}"
              )
          PY

      - name: Verify receipt content and record hashes
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path(
              "examples/13-receipt-envelope-cross-unit.json"
          )

          if not path.exists():
              raise SystemExit(
                  f"Missing receipt example: {path}"
              )

          receipt = json.loads(
              path.read_text(encoding="utf-8")
          )

          def canonical_json(value):
              return json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )

          # content_sha256 identifies the semantic receipt content:
          # kind + payload.
          content = {
              "kind": receipt["kind"],
              "payload": receipt["payload"],
          }

          content_actual = hashlib.sha256(
              canonical_json(content).encode("utf-8")
          ).hexdigest()

          content_expected = (
              receipt["integrity"]["content_sha256"]
          )

          if content_actual != content_expected:
              raise SystemExit(
                  "Receipt content hash mismatch:\n"
                  f"expected={content_expected}\n"
                  f"actual={content_actual}"
              )

          print(
              f"content_sha256 OK: {content_actual}"
          )

          # record_sha256 identifies this particular receipt record.
          # prev_hash and content_sha256 are part of the signed record.
          unsigned = {
              "schema_version":
                  receipt["schema_version"],

              "receipt_id":
                  receipt["receipt_id"],

              "recorded_at":
                  receipt["recorded_at"],

              "kind":
                  receipt["kind"],

              "payload":
                  receipt["payload"],

              "integrity": {
                  "prev_hash":
                      receipt["integrity"]["prev_hash"],

                  "content_sha256":
                      receipt["integrity"][
                          "content_sha256"
                      ],
              },
          }

          record_actual = hashlib.sha256(
              canonical_json(unsigned).encode("utf-8")
          ).hexdigest()

          record_expected = (
              receipt["integrity"]["record_sha256"]
          )

          if record_actual != record_expected:
              raise SystemExit(
                  "Receipt record hash mismatch:\n"
                  f"expected={record_expected}\n"
                  f"actual={record_actual}"
              )

          print(
              f"record_sha256 OK: {record_actual}"
          )

          print("\nReceipt integrity validation passed")
          PY

      - name: Contract summary
        run: |
          echo "Contract CI passed."
          echo "- JSON syntax: OK"
          echo "- JSON Schemas: OK"
          echo "- Positive examples: OK"
          echo "- Intentional negative example: rejected"
          echo "- Receipt content hash: OK"
          echo "- Receipt record hash: OK"
